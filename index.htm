<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>周树人 (@btc1860) - 导航主页</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000000;
      color: #e7e9ea;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background-color: #16181c;
      border: 1px solid #2f3336;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #1d9bf0;
      margin-bottom: 14px;
      background-color: #2f3336;
    }
    .name {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .badge {
      color: #1d9bf0;
      font-size: 16px;
    }
    .handle {
      color: #71767b;
      font-size: 14px;
      margin-top: 4px;
    }
    .bio {
      font-size: 15px;
      margin: 14px 0 24px;
      color: #e7e9ea;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .link-btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      background-color: #202327;
      color: #eff3f4;
      text-decoration: none;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid #2f3336;
      transition: all 0.2s ease;
    }
    .link-btn:hover {
      background-color: #1d9bf0;
      border-color: #1d9bf0;
      color: #ffffff;
      transform: translateY(-1px);
    }
    .link-btn.x-btn {
      background-color: #eff3f4;
      color: #0f1419;
    }
    .link-btn.x-btn:hover {
      background-color: #d7dbdc;
      border-color: #d7dbdc;
      color: #0f1419;
    }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #71767b;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- 如需显示头像，将下方 src 替换为您的头像图片链接即可 -->
    <img class="avatar" src="zsr.jpg" alt="周树人头像">
    
    <div class="name">
      周树人 <span class="badge">✔</span>
    </div>
    <div class="handle">@btc1860</div>
    <div class="bio">日常吃瓜 🍉</div>

    <div class="links">
      <a class="link-btn x-btn" href="https://x.com/btc1860" target="_blank" rel="noopener noreferrer">
        X (Twitter) 
      </a>
      <a class="link-btn" href="https://av.a169.org/li" target="_blank" rel="noopener noreferrer">
        🍉 劣迹艺人合集
      </a>
      <a class="link-btn" href="https://av.a169.org" target="_blank" rel="noopener noreferrer">
        🎬 AV番号查询
      </a>
      <!-- 如需添加更多链接，复制下面这行修改文字和 href 即可 -->
      <!-- <a class="link-btn" href="https://你的链接" target="_blank" rel="noopener noreferrer">自定义按钮名称</a> -->
    </div>

    <div class="footer">© 2026 @btc1860</div>
  </div>

</body>
</html>
